  berkshire_hathaway_energy:
    name: "Berkshire Hathaway Energy"
    # Shared Oracle tenant for the BHE companies (Northern Natural Gas,
    # MidAmerican, PacifiCorp, NV Energy, BHE Pipeline). The REST finder
    # returns the same 158 requisitions for every site number, so there is
