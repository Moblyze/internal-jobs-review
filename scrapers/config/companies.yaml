  # === Taleo TBE platform (added 2026-03-17) ===

  helix_energy:
    name: "Helix Energy Solutions"
    platform: taleo
    base_url: "https://phf.tbe.taleo.net/phf01/ats/careers/v2/jobSearch?org=HELIXESG&cws=45"
