    platform: successfactors_csb
    base_url: "https://jobs.rwe.com"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    sheet_name: "RWE"

  nextera_energy:
    name: "NextEra Energy"
    # Largest US wind and solar operator (86 'wind' titles); SEO plan register
    # item 10. Same Career Site Builder layout as Vestas, 25 rows per page.
    platform: successfactors_csb
    base_url: "https://jobs.nexteraenergy.com"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    sheet_name: "NextEra Energy"

  # === Indeed-to-employer recovery, config-only Workday tenants (added 2026-09-12) ===
  # docs/plans/2026-09-12-indeed-employers-to-direct-sources.md, section (b1).
