  # === Phenom TXM platform ===

  oceaneering:
    name: "Oceaneering"
    # Oceaneering migrated from Phenom to Oracle HCM Cloud (April 2026).
    # Old careers.oceaneering.com URLs 301-redirect to a generic landing page.
    # New site: https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs
    platform: oracle_hcm
    base_url: "https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs"
    rate_limit_delay: 2.5
    oracle_hcm_config:
      api_base: "https://ebfr.fa.us2.oraclecloud.com/hcmRestApi/resources/latest"
      site_number: "jobs"
      job_url_template: "https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs/job/{req_id}"
    selectors: {}
    sheet_name: "Oceaneering"

  # === Custom ASP.NET career portals ===

  rovop:
    name: "ROVOP"
    platform: rovop
    base_url: "https://jobs.rovop.com/jobs.aspx"
    rate_limit_delay: 3.0
    # ROVOP uses a custom ASP.NET career portal (not a known ATS platform).
    # Playwright browser scraping is required; no API or RSS feed available.
    selectors:
      # Primary selectors - job links contain /job/ in href
      job_link: 'a[href*="/job/"]'
      # Fallback selectors for description extraction on detail pages
      description: '.job-description, .description, [class*="description"], [itemprop="description"]'
      location: '.job-location, .location, [class*="location"]'
    sheet_name: "ROVOP"

  # === EasyApply/GetHired platform ===

  altrad_sparrows_us:
    name: "Altrad Sparrows"
    platform: easyapply
    base_url: "https://altradsparrowsuscareers.easyapply.co/"
    rate_limit_delay: 2.0
    # EasyApply uses RSS feed for extraction; fetch_detail_pages enables
    # JSON-LD parsing from individual job pages for employment type data.
    fetch_detail_pages: true
    # EasyApply uses RSS + JSON-LD, selectors not needed for primary extraction
    selectors:
      # Fallback selectors if HTML scraping ever needed
      job_list: "#list"
      job_card: "a.job_row"
      job_title: "span.font_18"
      location: "i.icon-map-marker + span"
    sheet_name: "Altrad Sparrows"

  # === Generic HTML career pages (Playwright-based) ===

  osm_thome:
    name: "OSM Thome"
    platform: html_generic
    base_url: "https://jobs.osmthome.com/"
    rate_limit_delay: 3.0
    # OSM Thome uses a Vue/Quasar SPA backed by a Laravel API at osmaportal.com.
    # The API returns all job data (title, location, description, employment type)
    # in paginated JSON — no browser or detail page visits needed.
    selectors:
      description: ".job-description, .description, .q-page, main"
      location: ".job-location, .location, [class*='location']"
    html_config:
      # Primary: use the portal API to get complete job data with locations
      portal_api_url: "https://maritime.osmaportal.com/api/jobs"
      portal_api_headers:
        X-Job-Portal: "yes"
      portal_per_page: 100
      # Fallback: sitemap extraction (locations from URL slugs only)
      sitemap_url: "https://jobs.osmthome.com/sitemap.xml"
      sitemap_job_pattern: "/jobs/"
      skip_detail_pages: true
    sheet_name: "OSM Thome"

  wellsafe_solutions:
    name: "Wellsafe Solutions"
    platform: html_generic
    base_url: "https://www.wellsafesolutions.com/available-positions/"
    rate_limit_delay: 3.0
    # Wellsafe is a WordPress site using Visual Composer. Jobs are in VC sections
    # with h3 headings. We extract via the WP REST API for reliable parsing.
    selectors:
      description: ".entry-content, .job-description, .wpb_wrapper, article, main"
      location: ".job-location, .location, [class*='location']"
    html_config:
      # Use WordPress REST API to extract job listings from page content
      wp_api_url: "https://www.wellsafesolutions.com/wp-json/wp/v2/pages/2140"
      skip_detail_pages: true
    sheet_name: "Wellsafe Solutions"

  allrig_group:
    name: "Allrig Group"
    platform: html_generic
    base_url: "https://allriggroup.com/en/careers/"
    rate_limit_delay: 3.0
    # Allrig is a custom CMS site behind CloudFront.
    # Job listings are plain <a> tags with href="/en/careers/{slug}/" and title attributes.
    # The link text is the job title. We rely on fallback link detection which scans
    # all links matching /careers/ pattern and filters out nav/utility links.
    selectors:
      job_card: ""
      job_title: ""
      job_link: ""
      job_location: ".location, .job-location"
      description: ".page-content, .text, .careers-detail, main"
      location: ".locations, .location, [class*='location']"
    html_config:
      wait_for: "a[href*='/en/careers/']"
      detail_wait_for: ".page-content, .text, .careers-detail"
      # URL patterns to exclude from fallback link detection (regex)
      exclude_url_patterns:
        - "/en/careers/$"
        - "/open-application/"
    sheet_name: "Allrig Group"

  coast_renewable:
    name: "Coast Renewable Services"
    platform: html_generic
    base_url: "https://coastrenewableservices.com/vacancies/"
    rate_limit_delay: 2.5
    # Coast Renewable is a WordPress site with custom job-item elements.
    # Structure: div.job-item > div.main-content > h3 (title)
    #            div.job-item > div.job-desc > a (detail link)
    selectors:
      job_card: "div.job-item"
      job_title: "h3"
      job_link: "div.job-desc a"
      job_location: ".location, .job-location"
      description: ".entry-content, .job-description, article, main"
      location: ".job-location, .location, [class*='location']"
    html_config:
      wait_for: "div.job-item, div.job-output"
      detail_wait_for: ".entry-content, article"
    sheet_name: "Coast Renewable Services"

  taurus_ig:
    name: "Taurus Industrial Group"
    platform: adp
    base_url: "https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=d096c643-dacd-480f-a2ad-6416f29abc6c&ccId=19000101_000001&lang=en_US"
    rate_limit_delay: 3.0
    # Taurus IG uses ADP Workforce Now for recruitment. The portal is a React SPA
    # that loads job data through internal API services. Playwright renders the SPA
    # and extracts job data from the DOM.
    adp_config:
      cid: "d096c643-dacd-480f-a2ad-6416f29abc6c"
      cc_id: "19000101_000001"
      lang: "en_US"
    sheet_name: "Taurus Industrial Group"

  pbs_offshore:
    name: "PBS by Ponticelli"
    platform: pbs_wordpress
    base_url: "https://www.pbs-offshore.com"
    rate_limit_delay: 3.0
    # PBS is a WordPress + Elementor site with a custom "job" post type.
    # Jobs are accessible via WP REST API: /wp-json/wp/v2/job
    # The careers page (/careers/) loads jobs via AJAX into #job-post-container.
    # As of 2026-03-17, the REST API returns 0 jobs (no active listings).
    # Using a dedicated scraper that queries the WP REST API directly.
    pbs_config:
      rest_endpoint: "/wp-json/wp/v2/job"
      per_page: 100
    selectors: {}
    sheet_name: "PBS by Ponticelli"

  # === Cezanne OnDemand / Intervieweb ===

  dron_dickson:
    name: "Dron & Dickson"
    platform: occupop
    base_url: "https://dronanddickson.occupop-careers.com/"
    rate_limit_delay: 3.0
    # Dron & Dickson moved from Cezanne OnDemand (Intervieweb) to Cezanne Recruitment
    # (Occupop). The old intervieweb.it URL now shows a login page.
    # This is a React SPA that loads job data client-side via Apollo GraphQL.
    selectors:
      job_card: "a[href*='/jobs/'], [class*='job-card'], [class*='JobCard'], .MuiCard-root"
      description: ".job-description, [class*='description'], .MuiTypography-body1"
      location: ".job-location, [class*='location']"
      employment_type: ".job-type, [class*='type']"
    sheet_name: "Dron & Dickson"

  # === Occupop / Cezanne Recruitment ===

  sulmara:
