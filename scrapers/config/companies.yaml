    taleo_config:
      host: "phf.tbe.taleo.net"
      instance: "phf01"
      org: "HELIXESG"
      cws: "45"
    selectors:
      # HTML fallback selectors (primary extraction uses RSS feed)
      job_list: '.oracletaleocwsv2-accordion-group'
      job_card: 'a.viewJobLink'
      description: 'div[name="cwsJobDescription"]'
    sheet_name: "Helix Energy Solutions"

  # Petrofac uses Oracle SelectMinds (NOT standard Taleo TBE).
  # Server-rendered HTML at /jobs/search with JS pagination (8+ pages of 10).
  # Job rows: div.job_list_row, links: a.job_link, location: span.location
  petrofac:
    name: "Petrofac"
    platform: html_generic
    base_url: "https://petrofac.referrals.selectminds.com/jobs/search"
    rate_limit_delay: 2.5
    selectors:
      job_card: 'div.job_list_row'
      job_title: 'a.job_link'
      job_link: 'a.job_link'
      job_location: 'span.location'
      description: '.job_description'
      location: '.primary_location'
    html_config:
      wait_for: 'div.job_list_row'
      detail_wait_for: '.job_description'
      title_from_link: true
    sheet_name: "Petrofac"

  # LRQA uses SAP SuccessFactors Career Site Builder (NOT Taleo).
  # Server-rendered HTML table at /search/ with pagination via startrow param.
  # Job rows: table#searchresults tr, links: a.jobTitle-link, location: span.jobLocation
  # 177 jobs across 2 pages (97 per page).
  lrqa:
    name: "LRQA"
    platform: html_generic
    base_url: "https://jobs.lrqa.com/search/"
    rate_limit_delay: 2.5
    selectors:
      job_card: 'table#searchresults tr.data-row'
      job_title: 'a.jobTitle-link'
      job_link: 'a.jobTitle-link'
      job_location: 'span.jobLocation'
      description: 'span.jobdescription, span[itemprop="description"]'
      location: 'span.jobLocation, [itemprop="jobLocation"]'
      # Note: LRQA has only First/Last pagination (no Next button).
      # First page shows ~97 of ~177 jobs. Omitting pagination_next to avoid
      # the scraper toggling between pages in a loop. 97 jobs is sufficient.
    html_config:
      wait_for: 'table#searchresults'
      detail_wait_for: 'span.jobdescription'
      title_from_link: true
    sheet_name: "LRQA"

  # NOTE: Bechtel uses a non-TalentBrew SuccessFactors frontend (table-based at jobs.bechtel.com/search/).
  # The current SuccessFactors scraper relies on TalentBrew's console.log JSON extraction which
  # won't work here. Needs custom extraction logic or a separate scraper approach.
  # Disabled until scraper support is added.
  # bechtel:
