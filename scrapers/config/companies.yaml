      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "Transocean"

  # === Workable ATS companies ===

  interocean:
    name: "Interocean Marine Services"
    platform: workable
    base_url: "https://apply.workable.com/interocean/"
    workable_slug: "interocean"
    rate_limit_delay: 2.0
    # Workable uses API-first approach, selectors not needed
    selectors: {}
    sheet_name: "Interocean Marine Services"

  # === Taleo TBE platform (added 2026-03-17) ===

  helix_energy:
    name: "Helix Energy Solutions"
    platform: taleo
    base_url: "https://phf.tbe.taleo.net/phf01/ats/careers/v2/jobSearch?org=HELIXESG&cws=45"
    rate_limit_delay: 2.5
    taleo_config:
      host: "phf.tbe.taleo.net"
      instance: "phf01"
      org: "HELIXESG"
      cws: "45"
    selectors:
      # HTML fallback selectors (primary extraction uses RSS feed)
      job_list: '.oracletaleocwsv2-accordion-group'
      job_card: 'a.viewJobLink'
      description: 'div[name="cwsJobDescription"]'
    sheet_name: "Helix Energy Solutions"

  # Petrofac uses Oracle SelectMinds (NOT standard Taleo TBE).
  # Server-rendered HTML at /jobs/search with JS pagination (8+ pages of 10).
  # Job rows: div.job_list_row, links: a.job_link, location: span.location
  petrofac:
    name: "Petrofac"
    platform: html_generic
    base_url: "https://petrofac.referrals.selectminds.com/jobs/search"
    rate_limit_delay: 2.5
    selectors:
      job_card: 'div.job_list_row'
      job_title: 'a.job_link'
      job_link: 'a.job_link'
      job_location: 'span.location'
      description: '.job_description'
      location: '.primary_location'
    html_config:
      wait_for: 'div.job_list_row'
      detail_wait_for: '.job_description'
      title_from_link: true
    sheet_name: "Petrofac"

  # LRQA uses SAP SuccessFactors Career Site Builder (NOT Taleo).
  # Server-rendered HTML table at /search/ with pagination via startrow param.
  # Job rows: table#searchresults tr, links: a.jobTitle-link, location: span.jobLocation
  # 177 jobs across 2 pages (97 per page).
  lrqa:
    name: "LRQA"
    platform: html_generic
    base_url: "https://jobs.lrqa.com/search/"
    rate_limit_delay: 2.5
    selectors:
      job_card: 'table#searchresults tr.data-row'
      job_title: 'a.jobTitle-link'
      job_link: 'a.jobTitle-link'
      job_location: 'span.jobLocation'
      description: 'span.jobdescription, span[itemprop="description"]'
      location: 'span.jobLocation, [itemprop="jobLocation"]'
      # Note: LRQA has only First/Last pagination (no Next button).
      # First page shows ~97 of ~177 jobs. Omitting pagination_next to avoid
      # the scraper toggling between pages in a loop. 97 jobs is sufficient.
    html_config:
      wait_for: 'table#searchresults'
      detail_wait_for: 'span.jobdescription'
      title_from_link: true
    sheet_name: "LRQA"

  # NOTE: Bechtel uses a non-TalentBrew SuccessFactors frontend (table-based at jobs.bechtel.com/search/).
  # The current SuccessFactors scraper relies on TalentBrew's console.log JSON extraction which
  # won't work here. Needs custom extraction logic or a separate scraper approach.
  # Disabled until scraper support is added.
  # bechtel:
  #   name: "Bechtel"
  #   platform: successfactors
  #   base_url: "https://jobs.bechtel.com/search/"
  #   rate_limit_delay: 2.5
  #   selectors:
  #     search_results: "#search-results-list"
  #     job_title_link: '[role="heading"] a'
  #   sf_config:
  #     company_id: "Bechtel"
  #     career_server: "career4"
  #     apply_url_template: "https://career4.successfactors.com/sfcareer/jobreqcareer?jobId={job_id}&company=Bechtel"
  #     pagination_type: "page"
  #   records_per_page: 25
  #   total_pages_estimate: 24
  #   sheet_name: "Bechtel"

  # === Phenom TXM platform ===

  oceaneering:
    name: "Oceaneering"
    # Oceaneering migrated from Phenom to Oracle HCM Cloud (April 2026).
    # Old careers.oceaneering.com URLs 301-redirect to a generic landing page.
    # New site: https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs
    platform: oracle_hcm
    base_url: "https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs"
    rate_limit_delay: 2.5
    oracle_hcm_config:
      api_base: "https://ebfr.fa.us2.oraclecloud.com/hcmRestApi/resources/latest"
      site_number: "jobs"
      job_url_template: "https://ebfr.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobs/job/{req_id}"
    selectors: {}
    sheet_name: "Oceaneering"

  # === Oracle HCM additions (added 2026-09-12, docs/plans/2026-09-12-new-job-sources.csv rows 1 and 4) ===

  team_industrial_services:
    name: "Team Industrial Services"
    # NDT / inspection / mechanical / rope access employer. The Oracle REST
    # feed is the same JSON the careers site loads (1,196 requisitions on
    # 2026-09-12). Requisitions drop out of the feed when closed, which is the
    # lifecycle removal signal.
    platform: oracle_hcm
    base_url: "https://epyc.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CLH-US"
    rate_limit_delay: 1.0
    # ~1,200 requisitions and every detail is one extra request: cap new
    # detail fetches per run so the first pass spreads over three days.
    max_new_details_per_run: 400
    oracle_hcm_config:
      api_base: "https://epyc.fa.us2.oraclecloud.com/hcmRestApi/resources/latest"
      site_number: "CLH-US"
      job_url_template: "https://epyc.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CLH-US/job/{req_id}"
    selectors: {}
    sheet_name: "Team Industrial Services"

  intertek:
    name: "Intertek"
    # TIC (testing, inspection, certification) employer and BD prospect.
    # Two career sites on one tenant: CX_1 (main board, 296) and CX_1003
    # (UK board, 29). Both are walked; a requisition on both is kept once.
    platform: oracle_hcm
    base_url: "https://hcog.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    oracle_hcm_config:
      api_base: "https://hcog.fa.em2.oraclecloud.com/hcmRestApi/resources/latest"
      site_numbers: ["CX_1", "CX_1003"]
      job_url_template: "https://hcog.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/{site}/job/{req_id}"
    selectors: {}
    sheet_name: "Intertek"

  # === SmartRecruiters Posting API (added 2026-09-12, new-job-sources.csv rows 6 and 7) ===
  # Public, documented, unauthenticated JSON API; one request per 100 postings
  # plus one detail request per posting not yet on the sheet. A posting drops
  # out of the listing when closed, which is the lifecycle removal signal.

  sgs:
    name: "SGS"
    # TIC employer with ~4,500 postings worldwide, most outside our sectors.
    # Pull the inspection / NDT / technician slices via the API's full-text
    # search instead of the whole board (many LatAm titles are in Spanish).
    platform: smartrecruiters
    base_url: "https://jobs.smartrecruiters.com/SGS"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    sr_config:
      company: "sgs"
      queries: ["inspector", "inspection", "NDT", "technician", "rope access", "welding", "surveyor", "offshore"]
    sheet_name: "SGS"

  boskalis:
    name: "Boskalis"
    # Dredging, offshore energy and subsea contractor. Gardline (survey) has no
    # SmartRecruiters board of its own; its careers page links into this one,
    # so Gardline roles arrive here. Small board, take it whole.
    platform: smartrecruiters
    base_url: "https://jobs.smartrecruiters.com/Boskalis"
    rate_limit_delay: 1.0
    sr_config:
      company: "boskalis"
    sheet_name: "Boskalis"

  vattenfall:
    name: "Vattenfall"
    # Nordic power and offshore wind operator; ~330 postings, many in Swedish.
    platform: smartrecruiters
    base_url: "https://jobs.smartrecruiters.com/Vattenfall"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    sr_config:
      company: "vattenfall"
    sheet_name: "Vattenfall"

  # === Wind and power employers (added 2026-09-12, new-job-sources.csv rows 2, 3, 12) ===

  ge_vernova:
    name: "GE Vernova"
    # Wind (onshore + offshore), gas power and grid. 2,137 postings on the
