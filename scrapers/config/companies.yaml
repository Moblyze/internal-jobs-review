# Company-specific scraper configuration for Workday platforms
#
# Each company defines:
# - name: Display name
# - platform: ATS platform (workday, avature, successfactors)
# - base_url: Workday portal URL
# - rate_limit_delay: Seconds to wait between requests (avoid anti-bot detection)
# - selectors: CSS/XPath selectors for data extraction
# - sheet_name: Google Sheets worksheet name for this company

companies:
  baker_hughes:
    name: "Baker Hughes"
    # 2026-09-12: switched from the Playwright scraper to the Workday CXS JSON
    # API. ~570 jobs x 10-17s per rendered detail page blew the 45 min timeout
    # every day (no successful scrape since 2026-04-16). One small JSON request
    # per job now; URLs are identical to the historical rows.
    platform: workday_api
    base_url: "https://bakerhughes.wd5.myworkdayjobs.com/BakerHughes"
    # Lightweight JSON requests, one at a time: ~1 req/s is well under what the
    # site's own single-page app fires.
    rate_limit_delay: 0.75
    sheet_name: "Baker Hughes"

  noble_corporation:
    name: "Noble Corporation"
    platform: workday
    base_url: "https://noblecorp.wd1.myworkdayjobs.com/noblecorp"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
      job_title: '[data-automation-id="jobPostingHeader"]'
      location: '[data-automation-id="locations"]'
      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "Noble Corporation"

  kbr:
    name: "KBR"
    # 2026-09-12: switched from the Playwright scraper to the Workday CXS JSON
    # API. KBR lists ~1,700 jobs; the browser scraper timed out before it even
    # finished paginating (no successful scrape since 2026-03-12). The old
    # max_detail_pages: 200 cap is gone too: it made the lifecycle treat every
    # job outside the newest 200 as removed.
    platform: workday_api
    base_url: "https://kbr.wd5.myworkdayjobs.com/KBR_Careers"
    rate_limit_delay: 0.75
    # A full first pass (1,700 details) measured 7,176s locally, so new detail
    # fetches are capped per run: the listing is always complete (lifecycle is
    # exact), while unseen jobs are picked up ~500 a day until caught up.
    max_new_details_per_run: 500
    timeout_seconds: 2700
    sheet_name: "KBR"

  subsea7:
    name: "Subsea7"
    platform: avature
    base_url: "https://careers.subsea7.com/go/All-Subsea7-Jobs/9310955/"
    rate_limit_delay: 3.0
    selectors:
      # Discovered selectors from browser inspection (Plan 02-03)
      job_list: "#job-tile-list"
      job_card: "li.job-tile"
      job_title: "a.jobTitle-link"
      location: "#job-location, .jobGeoLocation"
      posted_date: ".job-date, .date"
      description: '[itemprop="description"]'
      pagination_next: "a.next, a[rel='next'], .pagination a:last-child"
    sheet_name: "Subsea7"

  halliburton:
    name: "Halliburton"
    platform: successfactors
    base_url: "https://careers.halliburton.com/search-jobs"
    rate_limit_delay: 2.5
    selectors:
      search_results: "#search-results-list"
      job_title_link: '[role="heading"] a'
    sf_config:
      company_id: "HALprod"
      career_server: "career4"
      apply_url_template: "https://career4.successfactors.com/sfcareer/jobreqcareer?jobId={job_id}&company=HALprod"
      pagination_type: "page"  # Uses ?p=N pattern
    records_per_page: 15
    total_pages_estimate: 30
    sheet_name: "Halliburton"

  technipfmc:
    name: "TechnipFMC"
    platform: successfactors
    base_url: "https://careers.technipfmc.com/search-jobs"
    rate_limit_delay: 2.5
    selectors:
      search_results: "#search-results-list"
      job_title_link: '[role="heading"] a'
    sf_config:
      company_id: "fmctechno"
      career_server: "career41"
      apply_url_template: "https://career41.sapsf.com/sfcareer/jobreqcareer?jobId={job_id}&company=fmctechno"
      pagination_type: "startrow"  # Uses ?startrow=N pattern (N = (page-1) * records_per_page)
    records_per_page: 25
    total_pages_estimate: 7
    sheet_name: "TechnipFMC"

  schlumberger:
    name: "Schlumberger"
    platform: eightfold
    base_url: "https://slb.eightfold.ai/careers"
    rate_limit_delay: 2.5
    eightfold_domain: "slb.com"
    # Eightfold uses API-first approach, selectors not needed
    selectors:
      # Fallback selectors if browser scraping ever needed
      job_list: '[data-testid="position-card"]'
      job_title: '[data-testid="position-title"]'
    sheet_name: "Schlumberger"

  # === Wave 1: High-priority Workday additions (added 2026-02-10) ===

  chevron:
    name: "Chevron"
    platform: workday
    base_url: "https://chevron.wd5.myworkdayjobs.com/jobs"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
      job_title: '[data-automation-id="jobPostingHeader"]'
      location: '[data-automation-id="locations"]'
      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "Chevron"

  conocophillips:
    name: "ConocoPhillips"
    platform: workday
    base_url: "https://conocophillips.wd1.myworkdayjobs.com/External"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
      job_title: '[data-automation-id="jobPostingHeader"]'
      location: '[data-automation-id="locations"]'
      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "ConocoPhillips"

  occidental_petroleum:
    name: "Occidental Petroleum"
    platform: workday
    base_url: "https://oxy.wd5.myworkdayjobs.com/Corporate"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
      job_title: '[data-automation-id="jobPostingHeader"]'
      location: '[data-automation-id="locations"]'
      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "Occidental Petroleum"

  marathon_petroleum:
    name: "Marathon Petroleum"
    platform: workday
    base_url: "https://mpc.wd1.myworkdayjobs.com/MPCCareers"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
      job_title: '[data-automation-id="jobPostingHeader"]'
      location: '[data-automation-id="locations"]'
      posted_date: '[data-automation-id="postedOn"]'
      description: '[data-automation-id="jobPostingDescription"]'
    sheet_name: "Marathon Petroleum"

  # === Wave 2: Reusing existing scraper types (added 2026-02-10) ===

  worley:
    name: "Worley"
    platform: eightfold
    base_url: "https://jobs.worley.com/careers"
    rate_limit_delay: 2.5
    eightfold_domain: "worley.com"
    selectors:
      job_list: '[data-testid="position-card"]'
      job_title: '[data-testid="position-title"]'
    sheet_name: "Worley"

  phillips_66:
    name: "Phillips 66"
    platform: successfactors
    base_url: "https://careers.phillips66.com/search-jobs"
    rate_limit_delay: 2.5
    selectors:
      search_results: "#search-results-list"
      job_title_link: '[role="heading"] a'
    sf_config:
      company_id: "P66prod"
      career_server: "career4"
      apply_url_template: "https://career4.successfactors.com/sfcareer/jobreqcareer?jobId={job_id}&company=P66prod"
      # 2026-09-12: careers.phillips66.com no longer honors ?p=N (every page
      # returned page 1) and pages with ?startrow=N, 15 rows per page, like
      # TechnipFMC. Pages past the end return a 10-job fallback set rather
      # than an empty page, so the scraper also stops when a page adds no new
      # URLs (see successfactors.py).
      pagination_type: "startrow"
    records_per_page: 15
    total_pages_estimate: 20
    sheet_name: "Phillips 66"

  # === Wave 3: Priority additions (added 2026-03-12) ===

  bp:
    name: "BP"
    # 2026-09-12: switched to the Workday CXS JSON API (same repair as Baker
    # Hughes and KBR; the browser scraper timed out daily since 2026-06-12).
    # Note on robots: https://bpinternational.wd3.myworkdayjobs.com/robots.txt
    # has "Disallow: /bpCareers/" for every user agent, which covers the HTML
    # careers pages. We do not fetch those; the CXS endpoint
    # (/wday/cxs/bpinternational/bpCareers/...) sits outside the disallowed
    # prefix and is the JSON the site itself loads. Jesse's decision, Sept 12,
    # 2026: read the JSON feed. Job URLs are unchanged, so lifecycle history
    # carries over. 365 postings on the day of the switch.
    platform: workday_api
    base_url: "https://bpinternational.wd3.myworkdayjobs.com/bpCareers"
    rate_limit_delay: 0.75
    max_new_details_per_run: 400
    sheet_name: "BP"

  exxonmobil:
    name: "ExxonMobil"
    platform: successfactors
    base_url: "https://jobs.exxonmobil.com/search-jobs"
    rate_limit_delay: 2.5
    selectors:
      search_results: "#search-results-list"
      job_title_link: '[role="heading"] a'
    sf_config:
      company_id: "exxonmobilP"
      career_server: "career4"
      apply_url_template: "https://career4.successfactors.com/sfcareer/jobreqcareer?jobId={job_id}&company=exxonmobilP"
      pagination_type: "page"
    records_per_page: 25
    total_pages_estimate: 22
    sheet_name: "ExxonMobil"

  transocean:
    name: "Transocean"
    platform: workday
    base_url: "https://deepwater.wd1.myworkdayjobs.com/GlobalExternalCareerSite"
    rate_limit_delay: 2.5
    selectors:
      job_list: '[data-automation-id="jobResults"]'
      job_card: 'a[data-automation-id="jobTitle"]'
