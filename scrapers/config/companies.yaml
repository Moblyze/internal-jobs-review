    base_url: "https://sulmara.occupop-careers.com/"
    rate_limit_delay: 3.0
    # Sulmara uses Occupop (Cezanne Recruitment) - a React SPA career page.
    # Jobs are rendered client-side after hydration.
    selectors:
      job_card: "a[href*='/jobs/'], [class*='job-card'], [class*='JobCard'], .MuiCard-root"
      description: ".job-description, [class*='description'], .MuiTypography-body1"
      location: ".job-location, [class*='location']"
      employment_type: ".job-type, [class*='type']"
    sheet_name: "Sulmara"

