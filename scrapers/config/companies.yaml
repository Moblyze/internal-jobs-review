    # Wind turbine OEM and O&M (329 'technician' titles). SuccessFactors Career
    # Site Builder: server-rendered search listing, 10 rows per page, plus
    # sitemap.xml of live job URLs as the second presence signal.
    platform: successfactors_csb
    base_url: "https://careers.vestas.com"
    rate_limit_delay: 1.0
    max_new_details_per_run: 400
    sheet_name: "Vestas"

  rwe:
