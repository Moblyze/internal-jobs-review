# Cloudflare Pages project for the internal jobs review site + BD Intel Feed.
# Account is PINNED to Moblyze Ops. Never the live-product account
# (45bcf27c...) and never Jesse's personal account (82d362f9...).
name = "moblyze-jobs-review"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
account_id = "0afd187e12e71bdbbcab08d42eb5f14c"

# Private R2 bucket: people-data (feed/decision_makers.json), current/jobs-current.json.gz
# (ops consumers) and the full-corpus archive archive/jobs/YYYY-MM.jsonl.gz (never served).
# Served only through functions/data/[[path]].js, behind Cloudflare Access.
[[r2_buckets]]
binding = "PRIVATE_DATA"
bucket_name = "bd-feed-private"
