name: Trend Report

on:
  # Run daily at 11am UTC — after Auto Data Sync (~10:33 UTC).
  schedule:
    - cron: '0 11 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build trend data but do not write to Sheet)'
        required: false
        type: boolean
        default: false

jobs:
  trend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Run trend report
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
        run: |
          CMD="node scripts/trend-report/index.js"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          $CMD

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json
