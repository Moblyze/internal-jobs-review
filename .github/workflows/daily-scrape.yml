name: Daily Job Scraping

on:
  # Run daily at 9am UTC (1am PST / 4am EST)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional: Scrape only this company (e.g., baker_hughes)'
        required: false
        type: string
      max_jobs:
        description: 'Optional: Limit jobs per company (for testing)'
        required: false
        type: number
      dry_run:
        description: 'Dry run mode (extract but do not write to Sheets)'
        required: false
        type: boolean
        default: false
      skip_employer_scrapers:
        description: 'Skip employer scrapers (run aggregators only)'
        required: false
        type: boolean
        default: false
      skip_aggregators:
        description: 'Skip aggregator searches (run employer scrapers only)'
        required: false
        type: boolean
        default: false

jobs:
  # ── Job 1: Employer Scrapers (Workday, Taleo, Workable, etc.) ──
  # Runs in parallel with aggregators
  employer-scrapers:
    if: inputs.skip_employer_scrapers != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Download dedup state from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download scraper-state-latest -p scraper_state.db -D data/ 2>/dev/null \
            && echo "Restored dedup state ($(wc -c < data/scraper_state.db) bytes)" \
            || echo "No prior state found — starting fresh"

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Run employer scrapers
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
          LOG_LEVEL: INFO
        run: |
          CMD="python main.py"

          if [ -n "${{ inputs.company }}" ]; then
            CMD="$CMD --company ${{ inputs.company }}"
          fi

          if [ -n "${{ inputs.max_jobs }}" ]; then
            CMD="$CMD --max-jobs ${{ inputs.max_jobs }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Upload dedup state artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-state-employer
          path: scrapers/data/scraper_state.db
          retention-days: 1
          if-no-files-found: ignore

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: employer-scraper-logs-${{ github.run_id }}
          path: scrapers/logs/
          retention-days: 7

  # ── Job 2: Aggregator Searches (runs in parallel with employer scrapers) ──
  aggregator-searches:
    if: inputs.skip_aggregators != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dedup state from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download scraper-state-latest -p scraper_state.db -D data/ 2>/dev/null \
            && echo "Restored dedup state ($(wc -c < data/scraper_state.db) bytes)" \
            || echo "No prior state found — starting fresh"

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Run aggregator searches (all profiles, parallel batches)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
          LOG_LEVEL: INFO
        run: |
          # Run profiles in parallel batches of 4, with 10-min timeout per profile
          PROFILES=(
            subsea_oil_gas
            rope_access
            energy_trades
            survey_geophysical
            ndt_inspection
            drilling_operations
            marine_offshore_ops
            pipeline_mechanical
            industrial_construction
            process_plant_operations
            helix_energy
            interocean
            altrad_sparrows
            rovop
            oceaneering
            petrofac
            lrqa
            osm_thome
            wellsafe_solutions
            dron_dickson
            sulmara
            allrig
            coast_renewable
            taurus_ig
            pbs_ponticelli
            io_consulting
            finnco
            rig_integrity
          )

          FAILED=0
          SUCCEEDED=0
          BATCH_SIZE=4

          run_profile() {
            local PROFILE=$1
            echo "  Starting: $PROFILE"
            if timeout 600 python aggregator_cli.py search --profile "$PROFILE" --limit 50 --export 2>&1; then
              echo "  ✓ $PROFILE succeeded"
              return 0
            else
              echo "  ✗ $PROFILE failed (exit $?)"
              return 1
            fi
          }

          for ((i=0; i<${#PROFILES[@]}; i+=BATCH_SIZE)); do
            BATCH=("${PROFILES[@]:i:BATCH_SIZE}")
            echo ""
            echo "════════════════════════════════════════"
            echo "  Batch: ${BATCH[*]}"
            echo "════════════════════════════════════════"

            PIDS=()
            BATCH_PROFILES=()
            for PROFILE in "${BATCH[@]}"; do
              run_profile "$PROFILE" &
              PIDS+=($!)
              BATCH_PROFILES+=("$PROFILE")
            done

            # Wait for batch to complete
            for j in "${!PIDS[@]}"; do
              if wait "${PIDS[$j]}"; then
                SUCCEEDED=$((SUCCEEDED + 1))
              else
                echo "::warning::Aggregator profile '${BATCH_PROFILES[$j]}' failed"
                FAILED=$((FAILED + 1))
              fi
            done
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "  Aggregator Summary: $SUCCEEDED succeeded, $FAILED failed"
          echo "════════════════════════════════════════"

          # Fail the step only if ALL profiles failed
          if [ "$SUCCEEDED" -eq 0 ] && [ "$FAILED" -gt 0 ]; then
            echo "::error::All aggregator profiles failed"
            exit 1
          fi

      - name: Upload dedup state artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-state-aggregator
          path: scrapers/data/scraper_state.db
          retention-days: 1
          if-no-files-found: ignore

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aggregator-logs-${{ github.run_id }}
          path: scrapers/logs/
          retention-days: 7

  # ── Persist Dedup State (merge both jobs' state and upload to release) ──
  persist-state:
    needs: [employer-scrapers, aggregator-searches]
    if: always() && (needs.employer-scrapers.result == 'success' || needs.aggregator-searches.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download employer state
        uses: actions/download-artifact@v4
        with:
          name: scraper-state-employer
          path: state/employer/
        continue-on-error: true

      - name: Download aggregator state
        uses: actions/download-artifact@v4
        with:
          name: scraper-state-aggregator
          path: state/aggregator/
        continue-on-error: true

      - name: Merge state databases
        run: |
          python3 scrapers/scripts/merge_state_dbs.py \
            state/employer/scraper_state.db \
            state/aggregator/scraper_state.db \
            scraper_state.db

      - name: Record health snapshot + check for regressions
        id: health_check
        working-directory: scrapers
        # Swallow non-zero exit so the upload step below still runs; we
        # surface the failure in a later step once the fresh snapshot is
        # safely persisted.
        run: |
          python3 scripts/check_scrape_health.py --state-db ../scraper_state.db || echo "HEALTH_ALERT=1" >> $GITHUB_ENV

      - name: Upload merged state to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it doesn't exist yet
          gh release view scraper-state-latest 2>/dev/null || \
            gh release create scraper-state-latest \
              --title "Scraper Dedup State" \
              --notes "Persistent dedup state for the daily scraping workflow. Updated automatically after each run."

          gh release upload scraper-state-latest scraper_state.db --clobber
          echo "Uploaded merged state ($(wc -c < scraper_state.db) bytes)"

      - name: Fail workflow if health check reported critical regressions
        if: env.HEALTH_ALERT == '1'
        run: |
          echo "::error::Scrape health check detected one or more employers whose active-job count fell to zero. See the 'Record health snapshot' step above for details."
          exit 1

  # ── Update Source Coverage Matrix (runs after both complete) ──
  update-matrix:
    needs: [employer-scrapers, aggregator-searches]
    if: always() && (needs.employer-scrapers.result == 'success' || needs.aggregator-searches.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Update Source Coverage Matrix
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
        run: |
          python scripts/update_source_matrix.py

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

  # ── Slack Daily Digest (runs after scrape + matrix update) ──
  slack-digest:
    needs: [employer-scrapers, aggregator-searches, update-matrix]
    if: always() && (needs.employer-scrapers.result == 'success' || needs.aggregator-searches.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Download digest state from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download scraper-state-latest -p digest-state.json -D data/ 2>/dev/null \
            && echo "Restored digest state" \
            || echo "No prior digest state — starting fresh"

      - name: Run Slack daily digest
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node scripts/slack-daily-digest.js

      - name: Upload digest state to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/digest-state.json ]; then
            gh release view scraper-state-latest 2>/dev/null || \
              gh release create scraper-state-latest \
                --title "Scraper Dedup State" \
                --notes "Persistent state for the daily scraping workflow."
            gh release upload scraper-state-latest data/digest-state.json --clobber
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

  # ── Summary job (runs after all jobs complete) ──
  report:
    needs: [employer-scrapers, aggregator-searches, persist-state, update-matrix, slack-digest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "════════════════════════════════════════"
          echo "  Daily Job Scraping Summary"
          echo "════════════════════════════════════════"
          echo "  Employer scrapers: ${{ needs.employer-scrapers.result }}"
          echo "  Aggregator searches: ${{ needs.aggregator-searches.result }}"
          echo "  Persist dedup state: ${{ needs.persist-state.result }}"
          echo "  Source matrix update: ${{ needs.update-matrix.result }}"
          echo "  Slack digest: ${{ needs.slack-digest.result }}"
          echo "════════════════════════════════════════"

          if [ "${{ needs.employer-scrapers.result }}" = "failure" ] && [ "${{ needs.aggregator-searches.result }}" = "failure" ]; then
            echo "::error::Both employer scrapers and aggregator searches failed"
            exit 1
          fi
