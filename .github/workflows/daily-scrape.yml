name: Daily Job Scraping

on:
  # Run daily at 9am UTC (1am PST / 4am EST)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional: Scrape only this company (e.g., baker_hughes)'
        required: false
        type: string
      max_jobs:
        description: 'Optional: Limit jobs per company (for testing)'
        required: false
        type: number
      dry_run:
        description: 'Dry run mode (extract but do not write to Sheets)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Run job scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
          LOG_LEVEL: INFO
        run: |
          CMD="python main.py"

          if [ -n "${{ inputs.company }}" ]; then
            CMD="$CMD --company ${{ inputs.company }}"
          fi

          if [ -n "${{ inputs.max_jobs }}" ]; then
            CMD="$CMD --max-jobs ${{ inputs.max_jobs }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: scrapers/logs/
          retention-days: 7

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Job scraping failed. Check logs artifact for details."
          echo "Run ID: ${{ github.run_id }}"
          echo "Workflow: ${{ github.workflow }}"
