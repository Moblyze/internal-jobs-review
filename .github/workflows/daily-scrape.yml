name: Daily Job Scraping

on:
  # Run daily at 9am UTC (1am PST / 4am EST)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional: Scrape only this company (e.g., baker_hughes)'
        required: false
        type: string
      max_jobs:
        description: 'Optional: Limit jobs per company (for testing)'
        required: false
        type: number
      dry_run:
        description: 'Dry run mode (extract but do not write to Sheets)'
        required: false
        type: boolean
        default: false
      skip_employer_scrapers:
        description: 'Skip employer scrapers (run aggregators only)'
        required: false
        type: boolean
        default: false
      skip_aggregators:
        description: 'Skip aggregator searches (run employer scrapers only)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: inputs.skip_employer_scrapers != true
        run: |
          playwright install chromium

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      # ── Phase 1: Employer Scrapers (Workday, Avature, etc.) ──
      - name: Run employer scrapers
        if: inputs.skip_employer_scrapers != true
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
          LOG_LEVEL: INFO
        run: |
          CMD="python main.py"

          if [ -n "${{ inputs.company }}" ]; then
            CMD="$CMD --company ${{ inputs.company }}"
          fi

          if [ -n "${{ inputs.max_jobs }}" ]; then
            CMD="$CMD --max-jobs ${{ inputs.max_jobs }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Running: $CMD"
          $CMD

      # ── Phase 2: Aggregator Searches (Adzuna, Jooble, USAJobs, etc.) ──
      - name: Run aggregator searches (all 10 profiles)
        if: inputs.skip_aggregators != true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
          LOG_LEVEL: INFO
        run: |
          PROFILES=(
            subsea_oil_gas
            rope_access
            energy_trades
            survey_geophysical
            ndt_inspection
            drilling_operations
            marine_offshore_ops
            pipeline_mechanical
            industrial_construction
            process_plant_operations
          )

          FAILED=0
          SUCCEEDED=0

          for PROFILE in "${PROFILES[@]}"; do
            echo ""
            echo "════════════════════════════════════════"
            echo "  Aggregator search: $PROFILE"
            echo "════════════════════════════════════════"
            if python aggregator_cli.py search --profile "$PROFILE" --limit 50 --export; then
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::Aggregator profile '$PROFILE' failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "  Aggregator Summary: $SUCCEEDED succeeded, $FAILED failed"
          echo "════════════════════════════════════════"

          # Fail the step only if ALL profiles failed
          if [ "$SUCCEEDED" -eq 0 ] && [ "$FAILED" -gt 0 ]; then
            echo "::error::All aggregator profiles failed"
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f config/service_account.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: scrapers/logs/
          retention-days: 7

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Job scraping failed. Check logs artifact for details."
          echo "Run ID: ${{ github.run_id }}"
          echo "Workflow: ${{ github.workflow }}"
