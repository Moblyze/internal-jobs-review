name: Feed Ingest
on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK }}
        run: npm run ingest-feed

      - name: Commit feed updates
        run: |
          git config user.name 'feed-ingest[bot]'
          git config user.email 'feed-ingest[bot]@users.noreply.github.com'
          git add public/data/feed/
          if git diff --staged --quiet; then
            echo "no feed changes"
            exit 0
          fi
          git commit -m "chore(feed): auto-ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
