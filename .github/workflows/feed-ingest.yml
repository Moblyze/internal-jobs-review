name: Feed Ingest
on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK }}
        run: npm run ingest-feed

      - name: Commit feed updates
        id: commit
        run: |
          git config user.name 'feed-ingest[bot]'
          git config user.email 'feed-ingest[bot]@users.noreply.github.com'
          git add public/data/feed/
          if git diff --staged --quiet; then
            echo "no feed changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(feed): auto-ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Fast Deploy
        # deploy-fast.yml excludes public/data/** from its push filter, so the
        # bot commit above won't auto-deploy. Dispatch it explicitly when the
        # feed actually changed.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Fast Deploy (Code Only)" -R "$GITHUB_REPOSITORY"
