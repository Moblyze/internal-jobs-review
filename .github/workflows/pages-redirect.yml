name: GitHub Pages redirect stub (no data)

# SWITCH-OVER ONLY. Replaces whatever GitHub Pages serves with a tiny redirect
# page (index.html + 404.html, no data) pointing at the Access-protected site.
# Run once, manually, after the Cloudflare site is verified. Jesse's go required.
on:
  workflow_dispatch:

jobs:
  deploy-stub:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
