name: Retire Gone CrewBase Rows

# One-shot follow-up to the description backfill: sets Status=removed on the
# CrewBase rows whose pages the backfill verified as 410/404 at source. The
# verdicts come from crewbase-backfill-state.json on the scraper-state-latest
# release; each row it retires was individually fetched and confirmed gone.
# See scrapers/scripts/retire_gone_crewbase.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only; no writes to the sheet)'
        required: false
        type: boolean
        default: true

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        working-directory: scrapers
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download backfill state from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scrapers/data
          gh release download scraper-state-latest -p crewbase-backfill-state.json -D scrapers/data/
          echo "State: $(wc -c < scrapers/data/crewbase-backfill-state.json) bytes"

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Retire gone rows
        working-directory: scrapers
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: ${{ github.workspace }}/config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
        run: |
          CMD="python scripts/retire_gone_crewbase.py --state-path data/crewbase-backfill-state.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Upload tab backup as workflow artifact
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: crewbase-retire-backup-${{ github.run_id }}
          path: scrapers/data/CrewBase-retire-backup-*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Clean up credentials
        if: always()
        run: rm -f config/service_account.json
