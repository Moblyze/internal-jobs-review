name: Backfill OSM Thome Descriptions

# One-off (idempotent) repair: OSM Thome rows written while the API was
# blocked carry stub descriptions. This copies the full text from the
# off-CI listing snapshot (osm-snapshot.json on release scraper-state-latest,
# fetched by the Mac Studio), so it makes ZERO requests to OSM.
# See scrapers/scripts/backfill_osm_descriptions.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only; no writes to the sheet)'
        required: false
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OSM Thome listing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download scraper-state-latest -p osm-snapshot.json -D data/ --clobber
          echo "OSM snapshot: $(wc -c < data/osm-snapshot.json) bytes"

      - name: Create service account credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/service_account.json
          chmod 600 config/service_account.json

      - name: Run backfill
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: config/service_account.json
          GOOGLE_SHEETS_SPREADSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_NAME }}
        run: |
          CMD="python scripts/backfill_osm_descriptions.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then CMD="$CMD --dry-run"; fi
          echo "Running: $CMD"
          $CMD

      - name: Upload backup of old values
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: osm-desc-backfill-backup-${{ github.run_id }}
          path: scrapers/data/OSM-desc-backfill-backup-*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Clean up credentials
        if: always()
        run: rm -f config/service_account.json
