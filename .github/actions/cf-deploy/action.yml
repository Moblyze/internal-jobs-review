name: Deploy dist/ to Cloudflare Pages (Moblyze Ops)
description: Prepares dist/, uploads big data files to private R2, deploys to the Access-protected Pages project.
inputs:
  api-token:
    description: CLOUDFLARE_API_TOKEN (Pages Edit + R2 Edit on Moblyze Ops only)
    required: true
  account-id:
    description: CLOUDFLARE_ACCOUNT_ID (must be 0afd187e12e71bdbbcab08d42eb5f14c)
    required: true
  branch:
    description: Pages branch (main = production)
    default: main
runs:
  using: composite
  steps:
    - name: Guard, wrong-account protection
      shell: bash
      run: |
        if [ "${{ inputs.account-id }}" != "0afd187e12e71bdbbcab08d42eb5f14c" ]; then
          echo "::error::CLOUDFLARE_ACCOUNT_ID is not the Moblyze Ops account; refusing to deploy"; exit 1
        fi
    - name: Prepare dist for Pages (move oversize data to R2 staging)
      shell: bash
      run: node scripts/cf-prepare-dist.mjs
    - name: Upload big data files to private R2
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        cd .cf-r2
        for f in $(find . -type f -name '*.gz' | sed 's|^\./||'); do
          npx --yes wrangler@4 r2 object put "bd-feed-private/$f" --file "$f" --content-type application/json --content-encoding gzip --remote
        done
    - name: Deploy to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: npx --yes wrangler@4 pages deploy dist --project-name=moblyze-jobs-review --branch="${{ inputs.branch }}" --commit-dirty=true
