name: Deploy dist/ to Cloudflare Pages (Moblyze Ops)
description: Builds sharded site data, archives the full corpus to private R2, deploys to the Access-protected Pages project.
inputs:
  api-token:
    description: CLOUDFLARE_API_TOKEN (Pages Edit + R2 Edit on Moblyze Ops only)
    required: true
  account-id:
    description: CLOUDFLARE_ACCOUNT_ID (must be 0afd187e12e71bdbbcab08d42eb5f14c)
    required: true
  branch:
    description: Pages branch (main = production)
    default: main
runs:
  using: composite
  steps:
    - name: Guard, wrong-account protection
      shell: bash
      run: |
        if [ "${{ inputs.account-id }}" != "0afd187e12e71bdbbcab08d42eb5f14c" ]; then
          echo "::error::CLOUDFLARE_ACCOUNT_ID is not the Moblyze Ops account; refusing to deploy"; exit 1
        fi
    - name: Pull the prior archive months from private R2 (so rows that left the Sheet are never lost)
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        mkdir -p .cf-prior
        months="undated"
        m="2025-08"; end="$(date -u +%Y-%m)"
        while [ "$m" \< "$end" ] || [ "$m" = "$end" ]; do
          months="$months $m"
          m="$(date -u -d "$m-01 +1 month" +%Y-%m)"
        done
        for m in $months; do
          # A missing object is normal (first run, or a month with no rows yet); wrangler exits non-zero.
          npx --yes wrangler@4 r2 object get "bd-feed-private/archive/jobs/$m.jsonl.gz" --file ".cf-prior/$m.jsonl.gz" --remote >/dev/null 2>&1 || rm -f ".cf-prior/$m.jsonl.gz"
        done
        echo "prior archive months present: $(ls .cf-prior | wc -l)"
    - name: Pull the prior closed-job shards from private R2 (closed pages survive archiving)
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        # Since Nov 10, 2026 removed rows move off the Sheet, so jobs.json no longer carries
        # them and their closed pages come only from these shards. A shard that fails to
        # download would be overwritten without its slugs, so any miss stops the deploy.
        mkdir -p .cf-prior-closed
        npx --yes wrangler@4 --version >/dev/null
        for i in $(seq 0 255); do printf '%02x\n' "$i"; done | \
          xargs -P 8 -I{} sh -c 'for t in 1 2 3; do npx --yes wrangler@4 r2 object get "bd-feed-private/closed/{}.json.gz" --file ".cf-prior-closed/{}.json.gz" --remote >/dev/null 2>&1 && exit 0; sleep 5; done; exit 1' \
          || { echo "::error::could not download every prior closed shard; refusing to overwrite them"; exit 1; }
        echo "prior closed shards present: $(ls .cf-prior-closed | wc -l)"
    - name: Build sharded site data into dist and stage R2 artifacts
      shell: bash
      run: node scripts/build-site-data.mjs --prior-archive .cf-prior --prior-closed .cf-prior-closed
    - name: Final dist gate (drop non-site files, enforce Pages limits)
      shell: bash
      run: node scripts/cf-prepare-dist.mjs
    - name: Upload archive and current-jobs artifacts to private R2
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        cd .cf-r2
        # current/jobs-current.json.gz is served by the Pages Function, which adds Content-Encoding: gzip.
        # archive/* are plain downloadable .gz files (no content-encoding, so tools get the bytes as stored).
        # About 270 objects (256 closed/ shards + current + archive months): upload 8 at a time,
        # one wrangler call per object, serially, is estimated at ~10 min. xargs exits non-zero if any put fails.
        npx --yes wrangler@4 --version >/dev/null
        find . -type f -name '*.gz' | sed 's|^\./||' | \
          xargs -P 8 -I{} npx --yes wrangler@4 r2 object put "bd-feed-private/{}" --file "{}" --content-type application/gzip --remote
        echo "uploaded $(find . -type f -name '*.gz' | wc -l) objects to R2"
    - name: Deploy to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: npx --yes wrangler@4 pages deploy dist --project-name=moblyze-jobs-review --branch="${{ inputs.branch }}" --commit-dirty=true
